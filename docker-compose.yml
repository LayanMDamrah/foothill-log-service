services:
  app:
    build:
      context: .

    container_name: log-ingestion-app
    restart: unless-stopped

    environment:
      PORT: 8080

      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-logs_db}
      POSTGRES_USER: ${POSTGRES_USER:-logs_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-logs_password}

      DB_POOL_MAX: ${DB_POOL_MAX:-10}

      RETENTION_DAYS: ${RETENTION_DAYS:-30}
      RETENTION_INTERVAL_MS: ${RETENTION_INTERVAL_MS:-3600000}
      RETENTION_BATCH_SIZE: ${RETENTION_BATCH_SIZE:-5000}

    ports:
      - "8080:8080"

    cpus: 0.5
    mem_limit: 256m

    depends_on:
      postgres:
        condition: service_healthy

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:8080/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""
        ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  postgres:
    image: postgres:17

    container_name: log-ingestion-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB:-logs_db}
      POSTGRES_USER: ${POSTGRES_USER:-logs_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-logs_password}

    ports:
      - "5432:5432"

    cpus: 1.0
    mem_limit: 1g

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  postgres_data: